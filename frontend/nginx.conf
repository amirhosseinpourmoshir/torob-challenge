server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 2m;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://backend:8000;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
    location /api/ {
        proxy_pass $backend_upstream$request_uri;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 90s;
        add_header Cache-Control "no-store" always;
    }
    location /admin/ {
        proxy_pass $backend_upstream$request_uri;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /static/ { alias /srv/static/; expires 7d; }
    location /assets/ { try_files $uri =404; expires 1y; add_header Cache-Control "public, immutable"; }
    location = /index.html { add_header Cache-Control "no-cache"; }
    location / { try_files $uri $uri/ /index.html; }
}
