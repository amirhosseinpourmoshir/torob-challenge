worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    map $http_x_forwarded_proto $public_scheme {
        default $scheme;
        https https;
        http http;
    }
    server {
        listen 8080;
        server_name _;
        root /srv/frontend;
        index index.html;
        client_max_body_size 2m;
        location = /healthz { default_type text/plain; return 200 "ok\n"; }
        location ~ ^/(api|admin)/ {
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $public_scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 10s;
            proxy_read_timeout 90s;
            add_header Cache-Control "no-store" always;
        }
        location /static/ { alias /app/staticfiles/; expires 7d; }
        location /assets/ { try_files $uri =404; expires 1y; add_header Cache-Control "public, immutable"; }
        location = /index.html { add_header Cache-Control "no-cache"; }
        location / { try_files $uri $uri/ /index.html; }
    }
}
